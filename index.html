<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Projeto Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="card">
      <h1>Bem-vindo! 👋</h1>
      <p>Estrutura básica criada com <strong>HTML</strong>, <strong>CSS</strong> e <strong>JavaScript</strong>.</p>
      
      <div class="counter-box">
        <span id="counter-value">0</span>
        <div class="button-group">
          <button id="btn-decrease" class="btn btn-secondary">-1</button>
          <button id="btn-reset" class="btn btn-outline">Zerar</button>
          <button id="btn-increase" class="btn btn-primary">+1</button>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
